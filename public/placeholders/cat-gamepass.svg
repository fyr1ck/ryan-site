<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="Game Passes">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1233"/>
      <stop offset="1" stop-color="#0b0a12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#7c4dff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ticket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#5426c4"/>
    </linearGradient>
    <mask id="notch">
      <rect width="400" height="400" fill="#000000"/>
      <rect x="72" y="140" width="256" height="150" rx="26" fill="#ffffff"/>
      <circle cx="72" cy="215" r="24" fill="#000000"/>
      <circle cx="328" cy="215" r="24" fill="#000000"/>
    </mask>
  </defs>

  <rect x="20" y="20" width="360" height="360" rx="76" fill="url(#tile)"/>
  <rect x="20" y="20" width="360" height="360" rx="76" fill="url(#glow)"/>
  <rect x="21.5" y="21.5" width="357" height="357" rx="74.5" fill="none" stroke="#7c4dff" stroke-opacity="0.35" stroke-width="3"/>

  <g mask="url(#notch)">
    <rect x="72" y="140" width="256" height="150" rx="26" fill="url(#ticket)"/>
    <rect x="72" y="140" width="256" height="40" fill="#ffffff" fill-opacity="0.12"/>
  </g>

  <path d="M252 160 V270" stroke="#1a1233" stroke-opacity="0.6" stroke-width="6"
        stroke-linecap="round" stroke-dasharray="12 14"/>
  <polygon points="160,163 172.9,197.2 209.5,198.9 180.9,221.8 190.6,257.1 160,237 129.4,257.1 139.1,221.8 110.5,198.9 147.1,197.2"
           fill="#ffffff" fill-opacity="0.92"/>
  <rect x="268" y="186" width="44" height="10" rx="5" fill="#1a1233" fill-opacity="0.5"/>
  <rect x="268" y="208" width="44" height="10" rx="5" fill="#1a1233" fill-opacity="0.5"/>
  <rect x="268" y="230" width="44" height="10" rx="5" fill="#1a1233" fill-opacity="0.5"/>
</svg>
