<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Roblox Store">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#170d31"/>
      <stop offset="0.5" stop-color="#0e0b1c"/>
      <stop offset="1" stop-color="#08080e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#7c4dff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 H0 V48" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c1abff"/>
      <stop offset="1" stop-color="#8f66ff"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#5426c4"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b34c9"/>
      <stop offset="1" stop-color="#33188a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#7c4dff"/>

  <g>
    <path d="M600 118 L672 160 L600 202 L528 160 Z" fill="url(#cubeTop)"/>
    <path d="M528 160 L600 202 L600 268 L528 226 Z" fill="url(#cubeLeft)"/>
    <path d="M672 160 L600 202 L600 268 L672 226 Z" fill="url(#cubeRight)"/>
    <path d="M600 118 L672 160 L600 202 L528 160 Z" fill="none" stroke="#e0d5ff" stroke-opacity="0.55" stroke-width="2.5"/>
    <path d="M556 186 L584 200" stroke="#ffffff" stroke-opacity="0.28" stroke-width="6" stroke-linecap="round"/>
  </g>

  <text x="600" y="376" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="82"
        font-weight="700" letter-spacing="2" fill="#f5f5f7">ROBLOX STORE</text>

  <rect x="536" y="404" width="128" height="4" rx="2" fill="#7c4dff"/>

  <text x="600" y="464" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30"
        font-weight="500" fill="#9aa0ac">Produtos digitais de Roblox com entrega imediata</text>

  <text x="600" y="522" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24"
        font-weight="600" letter-spacing="2.4" fill="#c1abff">ROBUX &#183; CONTAS &#183; PETS &#183; SEMENTES &#183; GAME PASSES</text>

  <g>
    <rect x="356" y="552" width="488" height="50" rx="25" fill="#7c4dff" fill-opacity="0.14" stroke="#7c4dff" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="392" cy="577" r="6" fill="#4ade80"/>
    <text x="620" y="584" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18"
          font-weight="600" letter-spacing="1.4" fill="#d6c6ff">Pagamento via Pix &#183; Entrega autom&#225;tica</text>
  </g>
</svg>
