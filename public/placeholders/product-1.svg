<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Blox Fruits">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1038"/>
      <stop offset="0.55" stop-color="#110c22"/>
      <stop offset="1" stop-color="#08080e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#7c4dff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c1abff"/>
      <stop offset="1" stop-color="#8f66ff"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#5426c4"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b34c9"/>
      <stop offset="1" stop-color="#33188a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <text x="40" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600"
        letter-spacing="4.5" fill="#ffffff" fill-opacity="0.34">ROBLOX STORE</text>
  <rect x="40" y="64" width="52" height="3" rx="1.5" fill="#7c4dff"/>

  <g>
    <ellipse cx="400" cy="312" rx="118" ry="20" fill="#000000" fill-opacity="0.45"/>
    <path d="M400 90 L500 142 L400 194 L300 142 Z" fill="url(#top)"/>
    <path d="M300 142 L400 194 L400 300 L300 248 Z" fill="url(#left)"/>
    <path d="M500 142 L400 194 L400 300 L500 248 Z" fill="url(#right)"/>
    <path d="M400 90 L500 142 L400 194 L300 142 Z" fill="none" stroke="#e0d5ff" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M300 142 L300 248 M500 142 L500 248 M400 194 L400 300" stroke="#0a0a0f" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M330 168 L370 189" stroke="#ffffff" stroke-opacity="0.28" stroke-width="6" stroke-linecap="round"/>
  </g>

  <text x="400" y="384" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40"
        font-weight="700" letter-spacing="0.5" fill="#f5f5f7">Blox Fruits</text>
  <text x="400" y="414" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18"
        font-weight="500" letter-spacing="1.2" fill="#a78bfa">Entrega imediata</text>
</svg>
