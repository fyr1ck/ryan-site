<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Robux">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241a06"/>
      <stop offset="0.5" stop-color="#131020"/>
      <stop offset="1" stop-color="#08080e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#f6c94a" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#f6c94a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <linearGradient id="coin" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.5" stop-color="#f6c94a"/>
      <stop offset="1" stop-color="#c48a12"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <text x="40" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600"
        letter-spacing="4.5" fill="#ffffff" fill-opacity="0.34">ROBLOX STORE</text>
  <rect x="40" y="64" width="52" height="3" rx="1.5" fill="#7c4dff"/>

  <g>
    <ellipse cx="400" cy="316" rx="104" ry="18" fill="#000000" fill-opacity="0.45"/>
    <circle cx="400" cy="212" r="98" fill="#8a5f0c"/>
    <circle cx="400" cy="200" r="98" fill="url(#coin)"/>
    <circle cx="400" cy="200" r="80" fill="none" stroke="#8a5f0c" stroke-opacity="0.5" stroke-width="5"/>
    <path d="M340 152 A80 80 0 0 1 424 126" fill="none" stroke="#fff4d0" stroke-opacity="0.7"
          stroke-width="9" stroke-linecap="round"/>
    <text x="400" y="228" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="72"
          font-weight="700" fill="#4a3103">R$</text>
    <circle cx="556" cy="122" r="9" fill="#f6c94a" fill-opacity="0.85"/>
    <circle cx="596" cy="168" r="5" fill="#f6c94a" fill-opacity="0.6"/>
    <circle cx="228" cy="146" r="6" fill="#f6c94a" fill-opacity="0.55"/>
  </g>

  <text x="400" y="384" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40"
        font-weight="700" letter-spacing="0.5" fill="#f5f5f7">Robux</text>
  <text x="400" y="414" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18"
        font-weight="500" letter-spacing="1.2" fill="#a78bfa">Entrega imediata</text>
</svg>
