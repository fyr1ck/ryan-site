<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Contas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1c33"/>
      <stop offset="0.55" stop-color="#0f1024"/>
      <stop offset="1" stop-color="#08080e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <linearGradient id="key" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <text x="40" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600"
        letter-spacing="4.5" fill="#ffffff" fill-opacity="0.34">ROBLOX STORE</text>
  <rect x="40" y="64" width="52" height="3" rx="1.5" fill="#7c4dff"/>

  <g transform="rotate(-12 400 200)">
    <circle cx="288" cy="200" r="66" fill="none" stroke="url(#key)" stroke-width="30"/>
    <circle cx="288" cy="200" r="26" fill="none" stroke="#0d1c33" stroke-width="6" stroke-opacity="0.5"/>
    <rect x="348" y="185" width="212" height="30" rx="12" fill="url(#key)"/>
    <rect x="452" y="215" width="24" height="44" rx="8" fill="url(#key)"/>
    <rect x="512" y="215" width="24" height="60" rx="8" fill="url(#key)"/>
    <path d="M262 158 A46 46 0 0 1 300 146" fill="none" stroke="#ffffff" stroke-opacity="0.4"
          stroke-width="8" stroke-linecap="round"/>
  </g>

  <text x="400" y="384" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40"
        font-weight="700" letter-spacing="0.5" fill="#f5f5f7">Contas</text>
  <text x="400" y="414" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18"
        font-weight="500" letter-spacing="1.2" fill="#a78bfa">Entrega imediata</text>
</svg>
