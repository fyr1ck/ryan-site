<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Sementes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2318"/>
      <stop offset="0.55" stop-color="#0d1220"/>
      <stop offset="1" stop-color="#08080e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <linearGradient id="seed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d3ee6"/>
    </linearGradient>
    <linearGradient id="leafA" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#15803d"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="leafB" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <text x="40" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600"
        letter-spacing="4.5" fill="#ffffff" fill-opacity="0.34">ROBLOX STORE</text>
  <rect x="40" y="64" width="52" height="3" rx="1.5" fill="#7c4dff"/>

  <g>
    <ellipse cx="400" cy="314" rx="112" ry="18" fill="#000000" fill-opacity="0.45"/>
    <path d="M288 296 Q400 268 512 296" fill="none" stroke="#34d399" stroke-opacity="0.35"
          stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="400" cy="270" rx="52" ry="40" fill="url(#seed)" transform="rotate(-14 400 270)"/>
    <path d="M372 262 Q392 246 416 250" fill="none" stroke="#ffffff" stroke-opacity="0.35"
          stroke-width="7" stroke-linecap="round"/>
    <path d="M400 236 C396 200 398 176 400 150" fill="none" stroke="#22c55e" stroke-width="12" stroke-linecap="round"/>
    <path d="M398 214 C346 210 314 178 322 140 C368 134 396 172 398 214 Z" fill="url(#leafA)"/>
    <path d="M402 192 C446 184 474 148 466 112 C424 110 400 152 402 192 Z" fill="url(#leafB)"/>
    <circle cx="530" cy="150" r="7" fill="#34d399" fill-opacity="0.6"/>
    <circle cx="266" cy="182" r="5" fill="#34d399" fill-opacity="0.5"/>
  </g>

  <text x="400" y="384" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40"
        font-weight="700" letter-spacing="0.5" fill="#f5f5f7">Sementes</text>
  <text x="400" y="414" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18"
        font-weight="500" letter-spacing="1.2" fill="#a78bfa">Entrega imediata</text>
</svg>
