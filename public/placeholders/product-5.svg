    <ellipse cx="308" cy="146" rx="30" ry="40" fill="url(#paw)" transform="rotate(-22 308 146)"/>
    <ellipse cx="368" cy="116" rx="29" ry="42" fill="url(#paw)" transform="rotate(-8 368 116)"/>
    <ellipse cx="432" cy="116" rx="29" ry="42" fill="url(#paw)" transform="rotate(8 432 116)"/>
    <ellipse cx="492" cy="146" rx="30" ry="40" fill="url(#paw)" transform="rotate(22 492 146)"/>
    <path d="M344 222 Q372 202 408 208" fill="none" stroke="#ffffff" stroke-opacity="0.32"
