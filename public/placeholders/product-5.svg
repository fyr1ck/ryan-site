  <rect x="40" y="64" width="52" height="3" rx="1.5" fill="#7c4dff"/>

  <g>
    <ellipse cx="400" cy="318" rx="118" ry="18" fill="#000000" fill-opacity="0.45"/>
    <path d="M400 306 C338 306 296 278 296 242 C296 204 338 182 400 182 C462 182 504 204 504 242 C504 278 462 306 400 306 Z"
